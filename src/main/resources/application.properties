# ===== Serveur =====
server.port=8080

# ===== Base H2 en memoire (aucune installation requise) =====
spring.datasource.url=jdbc:h2:mem:quoteflow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables generees automatiquement (Code First) puis supprimees a l'arret
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 : http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Upload de fichiers =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Integration n8n =====
# Base des webhooks n8n (modifie si ton n8n tourne ailleurs)
app.n8n.base-url=http://localhost:5678/webhook

# ===== URLs et dossiers de generation =====
app.public-base-url=http://localhost:8080
app.pdf.demandes-dir=./generated/demandes
app.pdf.devis-dir=./generated/devis
app.uploads-dir=./uploads

# ===== JWT =====
# Le secret est lu depuis la variable d'environnement JWT_SECRET.
# Une valeur de repli (dev local uniquement) est utilisee si la variable est absente.
# En production, definir JWT_SECRET (>= 32 caracteres / 256 bits pour HS256).
app.jwt.secret=${JWT_SECRET:ChangeMoi_quoteflow_secret_key_min_32_caracteres_2026}
app.jwt.expiration-ms=86400000
